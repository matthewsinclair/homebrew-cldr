name: Homebrew install

on:
  push:
    branches: [main]
    paths: ["Formula/**"]
  pull_request:
    paths: ["Formula/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      # This official action also checks out and registers the tap under test.
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04
        with:
          stable: true
      - run: brew style matthewsinclair/cldr/cldr
      - run: brew audit --strict matthewsinclair/cldr/cldr
      - run: brew install --build-from-source matthewsinclair/cldr/cldr
      - run: brew test --verbose matthewsinclair/cldr/cldr
      - run: cldr --version

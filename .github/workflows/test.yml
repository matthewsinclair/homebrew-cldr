name: Homebrew install

on:
  push:
    branches: [main]
    paths: ["Formula/**"]
  pull_request:
    paths: ["Formula/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    name: formula present
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.look.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: look
        run: |
          if [ -f Formula/cldr.rb ]; then present=true; else present=false; fi
          echo "present=$present" >> "$GITHUB_OUTPUT"

  install:
    name: ${{ matrix.runner }}
    needs: formula
    if: needs.formula.outputs.present == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS alone: the formula installs cldr's signed macOS asset, for
        # Apple silicon, and there is no Linux asset to install
        runner: [macos-15]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      # This official action also checks out and registers the tap under test.
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04
        with:
          stable: true
      - run: brew style matthewsinclair/cldr/cldr
      - run: brew audit --strict matthewsinclair/cldr/cldr
      # The release's asset is signed and prebuilt; there is nothing to build
      - run: brew install matthewsinclair/cldr/cldr
      - run: brew test --verbose matthewsinclair/cldr/cldr
      - run: cldr --version
